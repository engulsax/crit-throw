<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crit Throw — tavern natural 20</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <header id="overlay" class="overlay" aria-label="Intro">
        <h1 class="overlay__title">Crit Throw</h1>
        <p class="overlay__line">The gold D20 hits twenty on this table.</p>
        <button type="button" id="skip" class="skip">Skip</button>
      </header>
      <div id="hud" aria-live="polite">
        <p id="result" class="result">—</p>
        <button type="button" id="roll" class="roll" hidden>Again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
