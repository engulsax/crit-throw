<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WebGL portfolio demo: one gold D20 on a candlelit tavern table. Physics roll with zero onboarding—not a polyhedral dice toolkit."
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta property="og:title" content="Crit Throw — WebGL tavern roll" />
    <meta
      property="og:description"
      content="One gold die on a candlelit tavern table. A single-scene physics roll for portfolio review—not a dice utility."
    />
    <meta property="og:url" content="https://engulsax.github.io/crit-throw/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://engulsax.github.io/crit-throw/og-image.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crit Throw — WebGL tavern roll" />
    <meta
      name="twitter:description"
      content="One gold die on a candlelit tavern table. A single-scene physics roll for portfolio review—not a dice utility."
    />
    <meta
      name="twitter:image"
      content="https://engulsax.github.io/crit-throw/og-image.png"
    />
    <title>Crit Throw — tavern natural 20</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <header id="overlay" class="overlay" aria-label="Intro">
        <h1 class="overlay__title">Crit Throw</h1>
        <p class="overlay__line">Candlelit table. One gold die.</p>
        <button type="button" id="skip" class="skip">Skip</button>
      </header>
      <div id="hud" aria-live="polite">
        <p id="result" class="result">—</p>
        <button type="button" id="roll" class="roll" hidden>Again</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
